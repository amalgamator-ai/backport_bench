  upstream: https://github.com/python/cpython.git
  difficulty: extreme
  source:
    branch: main
    sha: 3612d8f51741b11f36f8fb0494d79086bac9390a
    depth: 2
  target:
    branch: '3.12'
    sha: f3272d863004e291ab00620e71dee1cfa0fc9f83
    depth: 1
    upstream_branch: '3.12'
  fix:
    kind: commit
    sha: 3612d8f51741b11f36f8fb0494d79086bac9390a
  forbidden:
  - 19de092debb3d7e832e5672cc2f7b788d35951da
  - aa9eb5f757ceff461e6e996f12c89e5d9b583b01
