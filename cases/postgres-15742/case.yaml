# Single source of truth for this benchmark case.
# bench:    refs, fix and forbidden human backports; never mounted into a run.
# pipeline: rendered into cases/<case>/run/case.yaml and mounted at /case.
bench:
  upstream: https://github.com/postgres/postgres.git
  difficulty: medium
  source:
    branch: main
    sha: 918683d12d849a514cd38056aab882322c74adb4
    depth: 2
  target:
    branch: REL_14_STABLE
    sha: 1f49beef271ef920f129fcb8513c56347803444a
    depth: 1
  fix:
    kind: commit
    sha: 918683d12d849a514cd38056aab882322c74adb4
  forbidden:
  - 9505175f2a782bb63acd11d8d473a0ccedb719ea
pipeline:
  issue_id: CVE-2026-15742-postgres-14
  bug_description: |
    PostgreSQL's fuzzystrmatch extension (Levenshtein distance) performs size and index arithmetic that can integer-wrap for very large inputs. The result is a write to an effectively arbitrary address, allowing a query author to execute arbitrary code as the operating-system user running the database (CVE-2026-15742, CVSS 8.8). The fix commit on main is 918683d12d849a514cd38056aab882322c74adb4 ("Avoid overflow in Levenshtein distance calculations"). It hardens src/backend/utils/adt/levenshtein.c and src/backend/utils/adt/varlena.c and adds regression coverage to contrib/fuzzystrmatch. Port the fix and its tests to REL_14_STABLE.
  build:
    command: export PATH=/usr/bin:$PATH; export BISON_PKGDATADIR=/usr/share/bison; export M4=/usr/bin/m4; if [ ! -f GNUmakefile ]; then ./configure --without-readline --without-zlib --prefix="$PWD/../pg-inst"; fi; make -j8
    test_command: export PATH=/usr/bin:$PATH; export BISON_PKGDATADIR=/usr/share/bison; export M4=/usr/bin/m4; make -C contrib/fuzzystrmatch check
  model: deepseek-v41-flash
  advanced:
    context_length: 1000000
    max_build_test_retries: 3
    timeout_minutes: 120
    max_resolution_retries: 3
    fused_pre_red: true
    fused_resolution: true
    fused_compact_prompts: true
    tool_read_cap: 20000
    tool_bash_cap: 12000
