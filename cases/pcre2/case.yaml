# Single source of truth for this benchmark case.
# bench:    refs, fix and forbidden human backports; never mounted into a run.
# pipeline: rendered into cases/<case>/run/case.yaml and mounted at /case.
bench:
  upstream: https://github.com/PCRE2Project/pcre2.git
  difficulty: easy
  source:
    branch: main
    sha: a141712e5967d448c7ce13090ab530c8e3d82254
    depth: 2
  target:
    branch: release/pcre2-10.45
    sha: 2dce7761b1831fd3f82a9c2bd5476259d945da4d
    depth: 1
  fix:
    kind: commit
    sha: a141712e5967d448c7ce13090ab530c8e3d82254
  forbidden: []
pipeline:
  issue_id: CVE-2025-58050-pcre2-10.45
  bug_description: |
    PCRE2's matcher supports (*ACCEPT) inside a scan-substring block ((*scs:...)). When the block is
    entered the matcher saves the subject-buffer state; an (*ACCEPT) that unwinds out of the block did
    not restore that saved state, so the match state could point before the restored subject start and
    matching could read past the end of the subject buffer (CVE-2025-58050, out-of-bounds read). The
    upstream fix restores the saved buffer pointer when a scan-substring block is unwound by ACCEPT and
    adds a regression test to testdata/testinput2 and testdata/testoutput2. The backport must apply the
    same fix to the 10.45 release branch, whose matcher sources have diverged from main.
  build:
    command: |-
      cmake -S . -B build -DPCRE2_BUILD_TESTS=ON -DPCRE2_SUPPORT_JIT=OFF -DPCRE2_BUILD_PCRE2_16=ON -DPCRE2_BUILD_PCRE2_32=ON
      cmake --build build -j$(nproc)
    test_command: ctest --test-dir build --output-on-failure -R 'pcre2' --timeout 600
  advanced:
    timeout_minutes: 90
    fused_pre_red: true
    fused_resolution: true
    fused_compact_prompts: true
    tool_read_cap: 20000
    tool_bash_cap: 12000
    context_length: 1000000
  model: deepseek-v41-flash
