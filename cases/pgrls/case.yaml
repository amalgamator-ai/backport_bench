pipeline:
  issue_id: PG-2026-11-view-row-visibility
  bug_description: |
    An automatically updatable view's WHERE condition restricts the rows that an UPDATE, DELETE or MERGE through the view can affect to those visible through it. INSERT ... ON CONFLICT DO UPDATE through such a view did not follow this rule: the conflicting row is found through the arbiter index rather than by scanning the view, and the view's WHERE condition was never applied to it. A user whose privileges on a view allow an upsert through it, but who holds none on its base relation, could modify (and read) every row the view hides, one at a time, by guessing their keys. The fix makes rewriteTargetView() emit the view's WHERE quals as a WithCheckOption of a new kind (WCO_VIEW_CONFLICT_CHECK), which ExecOnConflictUpdate() and ExecOnConflictSelect() check against the conflicting row, innermost view first and before the ON CONFLICT WHERE clause is evaluated. It also updates the documentation and adds regression tests in the rowsecurity and updatable_views suites.
  build:
    command: export PATH=/usr/bin:$PATH; ([ -f configure ] || ./configure --without-readline --without-zlib) && make -j$(nproc)
    test_command: make check
  advanced:
    timeout_minutes: 60
    fused_pre_red: true
    fused_resolution: true
    fused_compact_prompts: true
    tool_read_cap: 20000
    tool_bash_cap: 12000
    context_length: 1000000
  model: deepseek-v41-flash
